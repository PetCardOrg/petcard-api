services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: petcard-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: petcard
      POSTGRES_PASSWORD: petcard123
      POSTGRES_DB: petcard_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petcard-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: petcard-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: petcard
      RABBITMQ_DEFAULT_PASS: petcard123

volumes:
  pgdata:
